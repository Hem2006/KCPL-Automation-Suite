<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KCPL Test Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface-hover: #334155;
    --border: #334155;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #eab308;
    --radius: 8px;
    --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    --mono: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 48px;
  }

  .container {
    width: 100%;
    max-width: 580px;
    padding: 24px;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 0.875rem;
    margin-bottom: 32px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 16px;
  }

  label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }

  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font);
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.15s;
  }

  input[type="text"]:focus,
  input[type="password"]:focus {
    border-color: var(--accent);
  }

  button {
    width: 100%;
    padding: 10px 16px;
    border: none;
    border-radius: var(--radius);
    font-family: var(--font);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    margin-top: 16px;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
  }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
  .btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .error-msg {
    color: var(--red);
    font-size: 0.85rem;
    margin-top: 8px;
    display: none;
  }

  /* Test picker */
  .test-picker {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    max-height: 420px;
    overflow-y: auto;
  }

  .spec-row {
    display: flex;
    align-items: center;
    padding: 10px 12px;
    cursor: pointer;
    transition: background 0.1s;
    border-bottom: 1px solid var(--border);
    user-select: none;
  }
  .spec-row:last-child { border-bottom: none; }
  .spec-row:hover { background: var(--surface-hover); }
  .spec-row.selected { background: rgba(59,130,246,0.12); }

  .spec-arrow {
    width: 20px;
    font-size: 0.7rem;
    color: var(--text-dim);
    flex-shrink: 0;
    transition: transform 0.15s;
  }
  .spec-arrow.open { transform: rotate(90deg); }

  .spec-name {
    flex: 1;
    font-size: 0.9rem;
    font-weight: 500;
  }

  .spec-count {
    font-size: 0.75rem;
    color: var(--text-dim);
    font-family: var(--mono);
    margin-left: 8px;
  }

  .spec-run-btn {
    width: auto;
    padding: 4px 12px;
    margin: 0 0 0 8px;
    font-size: 0.75rem;
    border-radius: 4px;
    background: var(--accent);
    color: #fff;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .spec-row:hover .spec-run-btn,
  .spec-row.selected .spec-run-btn { opacity: 1; }
  .spec-run-btn:hover { background: var(--accent-hover); }

  .test-list {
    display: none;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .test-list.open { display: block; }

  .test-item {
    display: flex;
    align-items: center;
    padding: 8px 12px 8px 40px;
    cursor: pointer;
    transition: background 0.1s;
    border-top: 1px solid rgba(51,65,85,0.5);
    font-size: 0.83rem;
    color: var(--text-dim);
  }
  .test-item:hover {
    background: var(--surface-hover);
    color: var(--text);
  }
  .test-item.selected {
    background: rgba(59,130,246,0.12);
    color: var(--accent);
    font-weight: 600;
  }

  .test-item-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    margin-right: 10px;
    flex-shrink: 0;
  }
  .test-item.selected .test-item-dot { background: var(--accent); }

  .test-item-name { flex: 1; }

  .test-loading {
    padding: 12px 40px;
    font-size: 0.8rem;
    color: var(--text-dim);
    border-top: 1px solid rgba(51,65,85,0.5);
  }
  .test-loading .spinner { margin-right: 6px; }

  .all-tests-row {
    display: flex;
    align-items: center;
    padding: 10px 12px;
    cursor: pointer;
    transition: background 0.1s;
    border-bottom: 1px solid var(--border);
    user-select: none;
  }
  .all-tests-row:hover { background: var(--surface-hover); }
  .all-tests-row.selected { background: rgba(59,130,246,0.12); }
  .all-tests-row .spec-name { font-weight: 600; }

  /* Selection info bar */
  .selection-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 12px;
    padding: 8px 12px;
    background: var(--bg);
    border-radius: var(--radius);
    font-size: 0.83rem;
    min-height: 38px;
  }
  .selection-label { color: var(--text-dim); }
  .selection-value { color: var(--accent); font-weight: 600; }

  /* Status panel */
  .status-panel { display: none; }

  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
  }
  .status-row + .status-row { border-top: 1px solid var(--border); }

  .status-label { color: var(--text-dim); font-size: 0.85rem; }
  .status-value { font-family: var(--mono); font-size: 0.85rem; font-weight: 600; }

  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .badge-waiting   { background: #1e293b; color: var(--text-dim); border: 1px solid var(--border); }
  .badge-queued    { background: #422006; color: var(--yellow); }
  .badge-running   { background: #172554; color: var(--accent); }
  .badge-completed { background: #052e16; color: var(--green); }
  .badge-failed    { background: #450a0a; color: var(--red); }

  .links { margin-top: 16px; display: flex; gap: 10px; }
  .links a {
    flex: 1;
    text-align: center;
    padding: 8px 12px;
    border-radius: var(--radius);
    font-size: 0.85rem;
    font-weight: 600;
    text-decoration: none;
    transition: background 0.15s;
  }
  .link-gh {
    background: var(--surface-hover);
    color: var(--text);
  }
  .link-gh:hover { background: #475569; }
  .link-allure {
    background: var(--accent);
    color: #fff;
  }
  .link-allure:hover { background: var(--accent-hover); }

  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="container">
  <h1>KCPL Test Dashboard</h1>
  <p class="subtitle">Trigger and monitor Playwright smoke tests</p>

  <!-- Login -->
  <div id="login-section" class="card">
    <label for="username">Username</label>
    <input type="text" id="username" placeholder="Enter username" autocomplete="username">
    <label for="password" style="margin-top:14px">Password</label>
    <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
    <div id="login-error" class="error-msg">Invalid credentials. Try again.</div>
    <button class="btn-primary" id="login-btn">Sign in</button>
  </div>

  <!-- Trigger (hidden until logged in) -->
  <div id="trigger-section" class="card hidden">
    <label>Select test to run</label>
    <div class="test-picker" id="test-picker"></div>
    <div class="selection-bar">
      <span class="selection-label">Selected:</span>
      <span class="selection-value" id="selection-display">All tests (full suite)</span>
    </div>
    <button class="btn-primary" id="trigger-btn">Run tests</button>
    <div id="trigger-error" class="error-msg"></div>
  </div>

  <!-- Status (hidden until a run is triggered) -->
  <div id="status-section" class="card status-panel">
    <label>Run status</label>
    <div class="status-row">
      <span class="status-label">Test</span>
      <span class="status-value" id="st-spec">—</span>
    </div>
    <div class="status-row">
      <span class="status-label">Status</span>
      <span id="st-badge"><span class="badge badge-waiting">waiting</span></span>
    </div>
    <div class="status-row" id="st-run-row" style="display:none">
      <span class="status-label">Run</span>
      <span class="status-value" id="st-run">#—</span>
    </div>
    <div id="st-links" class="links" style="display:none">
      <a id="link-gh" class="link-gh" href="#" target="_blank" rel="noopener">GitHub Actions</a>
      <a id="link-allure" class="link-allure" href="https://kcpl-automation-suite.vercel.app" target="_blank" rel="noopener">Allure Report</a>
    </div>
  </div>
</div>

<script>
(function () {
  const $ = (s) => document.querySelector(s);

  const SPECS = [
    { file: '01-login.spec.ts',                label: '01 - Login' },
    { file: '02-navigation.spec.ts',            label: '02 - Navigation' },
    { file: '03-creation.spec.ts',              label: '03 - Creation' },
    { file: '04-receipt.spec.ts',               label: '04 - Receipt' },
    { file: '05-auction.spec.ts',               label: '05 - Auction' },
    { file: '06-guarantor.spec.ts',             label: '06 - Guarantor details' },
    { file: '07-payment-voucher.spec.ts',       label: '07 - Payment voucher' },
    { file: '08-paid-voucher.spec.ts',          label: '08 - Paid voucher List' },
    { file: '09-collection.spec.ts',            label: '09 - Collection' },
    { file: '10-report.spec.ts',                label: '10 - Report' },
    { file: '11-accounts-creation.spec.ts',     label: '11 - Accounts Creation' },
    { file: '12-accounts-transaction.spec.ts',  label: '12 - Accounts Transaction' },
    { file: '13-accounts-report.spec.ts',       label: '13 - Accounts Report' },
    { file: '14-hr.spec.ts',                    label: '14 - HR' },
    { file: '15-audit.spec.ts',                 label: '15 - Audit' },
    { file: '16-legal.spec.ts',                 label: '16 - Legal' },
  ];

  const loginSection   = $('#login-section');
  const triggerSection  = $('#trigger-section');
  const statusSection   = $('#status-section');
  const loginBtn        = $('#login-btn');
  const loginError      = $('#login-error');
  const usernameInput   = $('#username');
  const passwordInput   = $('#password');
  const triggerBtn      = $('#trigger-btn');
  const triggerError    = $('#trigger-error');
  const picker          = $('#test-picker');
  const selDisplay      = $('#selection-display');

  let pollTimer = null;
  let selection = { specFile: 'all', testGrep: '', label: 'All tests (full suite)' };
  const testCache = {};

  // --- Login ---
  async function login() {
    loginBtn.disabled = true;
    loginError.style.display = 'none';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: usernameInput.value, password: passwordInput.value }),
      });
      if (res.ok) {
        showTrigger();
      } else {
        loginError.style.display = 'block';
      }
    } catch {
      loginError.textContent = 'Network error. Try again.';
      loginError.style.display = 'block';
    }
    loginBtn.disabled = false;
  }

  loginBtn.addEventListener('click', login);
  passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
  usernameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') passwordInput.focus(); });

  function showTrigger() {
    loginSection.classList.add('hidden');
    triggerSection.classList.remove('hidden');
    buildPicker();
  }

  async function checkSession() {
    try {
      const res = await fetch('/api/status?triggeredAt=0');
      if (res.status !== 401) showTrigger();
    } catch {}
  }
  checkSession();

  // --- Test Picker ---
  function buildPicker() {
    picker.innerHTML = '';

    // "All tests" row
    const allRow = document.createElement('div');
    allRow.className = 'all-tests-row selected';
    allRow.innerHTML = '<span class="spec-name">All tests (full suite)</span>';
    allRow.addEventListener('click', () => {
      clearSelections();
      allRow.classList.add('selected');
      selection = { specFile: 'all', testGrep: '', label: 'All tests (full suite)' };
      selDisplay.textContent = selection.label;
    });
    picker.appendChild(allRow);

    SPECS.forEach((spec) => {
      const wrapper = document.createElement('div');

      // Spec row
      const row = document.createElement('div');
      row.className = 'spec-row';
      row.innerHTML = `
        <span class="spec-arrow">&#9654;</span>
        <span class="spec-name">${spec.label}</span>
        <span class="spec-count"></span>
        <button class="spec-run-btn" title="Run entire file">Run all</button>
      `;

      const arrow = row.querySelector('.spec-arrow');
      const countEl = row.querySelector('.spec-count');
      const runBtn = row.querySelector('.spec-run-btn');

      // Test list container
      const testList = document.createElement('div');
      testList.className = 'test-list';

      // Click the row to expand/collapse
      row.addEventListener('click', (e) => {
        if (e.target === runBtn) return;
        const isOpen = testList.classList.contains('open');
        if (isOpen) {
          testList.classList.remove('open');
          arrow.classList.remove('open');
        } else {
          testList.classList.add('open');
          arrow.classList.add('open');
          loadTests(spec.file, testList, countEl);
        }
      });

      // "Run all" button selects the whole file
      runBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        clearSelections();
        row.classList.add('selected');
        selection = { specFile: spec.file, testGrep: '', label: spec.label };
        selDisplay.textContent = selection.label;
      });

      wrapper.appendChild(row);
      wrapper.appendChild(testList);
      picker.appendChild(wrapper);
    });
  }

  function clearSelections() {
    picker.querySelectorAll('.selected').forEach(el => el.classList.remove('selected'));
  }

  async function loadTests(file, container, countEl) {
    if (testCache[file]) {
      renderTests(file, testCache[file], container, countEl);
      return;
    }

    container.innerHTML = '<div class="test-loading"><span class="spinner"></span>Loading tests...</div>';

    try {
      const res = await fetch(`/api/tests?file=${encodeURIComponent(file)}`);
      if (!res.ok) {
        container.innerHTML = '<div class="test-loading">Failed to load tests</div>';
        return;
      }
      const data = await res.json();
      const tests = data[file] || [];
      testCache[file] = tests;
      renderTests(file, tests, container, countEl);
    } catch {
      container.innerHTML = '<div class="test-loading">Failed to load tests</div>';
    }
  }

  function renderTests(file, tests, container, countEl) {
    countEl.textContent = tests.length + ' tests';
    container.innerHTML = '';

    if (tests.length === 0) {
      container.innerHTML = '<div class="test-loading">No tests found</div>';
      return;
    }

    tests.forEach((name) => {
      const item = document.createElement('div');
      item.className = 'test-item';
      item.innerHTML = `<span class="test-item-dot"></span><span class="test-item-name">${escapeHtml(name)}</span>`;

      item.addEventListener('click', () => {
        clearSelections();
        item.classList.add('selected');
        const specLabel = SPECS.find(s => s.file === file)?.label || file;
        selection = { specFile: file, testGrep: name, label: specLabel + ' > ' + name };
        selDisplay.textContent = selection.label;
      });

      container.appendChild(item);
    });
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // --- Trigger ---
  async function trigger() {
    triggerBtn.disabled = true;
    triggerError.style.display = 'none';

    try {
      const res = await fetch('/api/trigger', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ specFile: selection.specFile, testGrep: selection.testGrep }),
      });
      const data = await res.json();
      if (!res.ok) {
        triggerError.textContent = data.error || 'Trigger failed';
        triggerError.style.display = 'block';
        triggerBtn.disabled = false;
        return;
      }

      $('#st-spec').textContent = selection.label;
      setBadge('waiting');
      $('#st-run-row').style.display = 'none';
      $('#st-links').style.display = 'none';
      statusSection.style.display = 'block';

      startPolling(data.triggeredAt);
    } catch {
      triggerError.textContent = 'Network error';
      triggerError.style.display = 'block';
    }
    triggerBtn.disabled = false;
  }

  triggerBtn.addEventListener('click', trigger);

  // --- Status polling ---
  function setBadge(status) {
    const map = {
      waiting: 'badge-waiting',
      queued: 'badge-queued',
      in_progress: 'badge-running',
      completed: 'badge-completed',
      failure: 'badge-failed',
    };
    const cls = map[status] || 'badge-waiting';
    const text = status === 'in_progress' ? 'running' : status;
    const spinner = (status === 'waiting' || status === 'queued' || status === 'in_progress')
      ? '<span class="spinner"></span>' : '';
    $('#st-badge').innerHTML = `${spinner}<span class="badge ${cls}">${text}</span>`;
  }

  function startPolling(triggeredAt) {
    if (pollTimer) clearInterval(pollTimer);

    const poll = async () => {
      try {
        const res = await fetch(`/api/status?triggeredAt=${triggeredAt}`);
        if (res.status === 401) { location.reload(); return; }
        const data = await res.json();

        if (!data.found) {
          setBadge('waiting');
          return;
        }

        setBadge(data.conclusion === 'failure' ? 'failure' :
                 data.conclusion === 'success' ? 'completed' :
                 data.status);

        if (data.run_number) {
          $('#st-run-row').style.display = 'flex';
          $('#st-run').textContent = `#${data.run_number}`;
        }

        if (data.html_url) {
          $('#st-links').style.display = 'flex';
          $('#link-gh').href = data.html_url;
        }

        if (data.status === 'completed') {
          clearInterval(pollTimer);
          pollTimer = null;
        }
      } catch {}
    };

    poll();
    pollTimer = setInterval(poll, 5000);
  }
})();
</script>

</body>
</html>
