<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KCPL Test Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --border: #d8dce3;
    --border-light: #e8ecf1;
    --text: #212529;
    --text-mid: #495057;
    --text-dim: #868e96;
    --primary: #1971c2;
    --primary-hover: #1864ab;
    --primary-bg: #e7f5ff;
    --green: #2b8a3e;
    --green-bg: #ebfbee;
    --red: #c92a2a;
    --red-bg: #fff5f5;
    --yellow: #e67700;
    --yellow-bg: #fff9db;
    --radius: 4px;
    --font: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
    --mono: 'Cascadia Code', 'Consolas', 'Monaco', monospace;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
  }

  /* Top bar */
  .topbar {
    background: var(--primary);
    color: #fff;
    padding: 0 32px;
    height: 48px;
    display: flex;
    align-items: center;
    gap: 24px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .topbar-title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.02em;
    margin-right: auto;
  }
  .topbar-link {
    color: rgba(255,255,255,0.8);
    text-decoration: none;
    padding: 12px 0;
    border-bottom: 2px solid transparent;
    transition: color 0.1s, border-color 0.1s;
    font-weight: 500;
  }
  .topbar-link:hover, .topbar-link.active {
    color: #fff;
    border-bottom-color: #fff;
  }

  /* Page content */
  .page {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 32px;
  }

  .page-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 4px;
    color: var(--text);
  }

  .page-desc {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 24px;
  }

  /* Layout */
  .columns {
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }

  .col-main { flex: 1; min-width: 0; }
  .col-side { width: 380px; flex-shrink: 0; }

  /* Panel */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 20px;
  }

  .panel-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    font-weight: 700;
    color: var(--text-mid);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    background: #fafbfc;
    border-radius: var(--radius) var(--radius) 0 0;
  }

  .panel-body {
    padding: 16px;
  }

  /* Login */
  .login-wrap {
    max-width: 400px;
    margin: 80px auto 0;
  }

  .field-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-mid);
    margin-bottom: 4px;
  }

  .field-label + .field-label { margin-top: 12px; }

  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 8px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }

  input[type="text"]:focus,
  input[type="password"]:focus {
    border-color: var(--primary);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 8px 20px;
    border: 1px solid transparent;
    border-radius: var(--radius);
    font-family: var(--font);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.12s;
    text-decoration: none;
  }

  .btn-primary {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-outline {
    background: var(--surface);
    color: var(--text-mid);
    border-color: var(--border);
  }
  .btn-outline:hover { background: var(--bg); }

  .btn-block { width: 100%; margin-top: 16px; }

  .error-msg {
    color: var(--red);
    font-size: 13px;
    margin-top: 6px;
    display: none;
  }

  /* Test list */
  .test-list-wrap {
    max-height: 520px;
    overflow-y: auto;
  }

  .test-list-wrap::-webkit-scrollbar { width: 5px; }
  .test-list-wrap::-webkit-scrollbar-track { background: transparent; }
  .test-list-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .spec-row {
    display: flex;
    align-items: center;
    padding: 9px 16px;
    cursor: pointer;
    transition: background 0.08s;
    border-bottom: 1px solid var(--border-light);
    user-select: none;
    font-size: 13px;
  }
  .spec-row:last-child { border-bottom: none; }
  .spec-row:hover { background: #f8f9fa; }
  .spec-row.selected { background: var(--primary-bg); }

  .spec-arrow {
    width: 18px;
    font-size: 9px;
    color: var(--text-dim);
    flex-shrink: 0;
    transition: transform 0.12s;
  }
  .spec-arrow.open { transform: rotate(90deg); }

  .spec-name {
    flex: 1;
    font-weight: 500;
    color: var(--text);
  }

  .spec-count {
    font-size: 11px;
    color: var(--text-dim);
    font-family: var(--mono);
    margin-left: 8px;
  }

  .spec-run-btn {
    padding: 3px 10px;
    margin: 0 0 0 6px;
    font-size: 11px;
    border-radius: 3px;
    background: var(--primary);
    color: #fff;
    border: none;
    opacity: 0;
    transition: opacity 0.1s;
    cursor: pointer;
    width: auto;
  }
  .spec-row:hover .spec-run-btn { opacity: 1; }
  .spec-run-btn:hover { background: var(--primary-hover); }

  .test-sub {
    display: none;
    background: #fafbfc;
    border-bottom: 1px solid var(--border-light);
  }
  .test-sub.open { display: block; }

  .test-item {
    display: flex;
    align-items: center;
    padding: 7px 16px 7px 44px;
    cursor: pointer;
    transition: background 0.08s;
    border-top: 1px solid var(--border-light);
    font-size: 12px;
    color: var(--text-dim);
  }
  .test-item:hover {
    background: #f1f3f5;
    color: var(--text);
  }
  .test-item.selected {
    background: var(--primary-bg);
    color: var(--primary);
    font-weight: 600;
  }

  .test-item-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--border);
    margin-right: 8px;
    flex-shrink: 0;
  }
  .test-item.selected .test-item-dot { background: var(--primary); }

  .test-item-name { flex: 1; }

  .test-loading {
    padding: 10px 44px;
    font-size: 12px;
    color: var(--text-dim);
    border-top: 1px solid var(--border-light);
  }

  .all-row {
    display: flex;
    align-items: center;
    padding: 9px 16px;
    cursor: pointer;
    transition: background 0.08s;
    border-bottom: 1px solid var(--border-light);
    user-select: none;
    font-size: 13px;
  }
  .all-row:hover { background: #f8f9fa; }
  .all-row.selected { background: var(--primary-bg); }
  .all-row .spec-name { font-weight: 700; }

  /* Selection bar */
  .sel-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    background: #fafbfc;
    border-radius: 0 0 var(--radius) var(--radius);
  }
  .sel-label { color: var(--text-dim); }
  .sel-value { color: var(--primary); font-weight: 600; }

  .trigger-footer {
    margin-top: 12px;
    display: flex;
    gap: 8px;
  }
  .trigger-footer .btn { flex: 1; }

  /* Status */
  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 0;
    font-size: 13px;
  }
  .status-row + .status-row { border-top: 1px solid var(--border-light); }

  .status-label { color: var(--text-dim); }
  .status-value { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--text); }

  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 3px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .badge-waiting   { background: #f1f3f5; color: var(--text-dim); }
  .badge-queued    { background: var(--yellow-bg); color: var(--yellow); }
  .badge-running   { background: var(--primary-bg); color: var(--primary); }
  .badge-completed { background: var(--green-bg); color: var(--green); }
  .badge-failed    { background: var(--red-bg); color: var(--red); }

  .action-links {
    margin-top: 14px;
    display: flex;
    gap: 8px;
  }
  .action-links .btn { flex: 1; text-align: center; font-size: 12px; padding: 7px 12px; }

  .spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 5px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hidden { display: none !important; }

  @media (max-width: 768px) {
    .columns { flex-direction: column; }
    .col-side { width: 100%; }
    .topbar { padding: 0 16px; }
    .page { padding: 16px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-title">KCPL Automation</span>
  <a class="topbar-link active" href="#">Dashboard</a>
  <a class="topbar-link" href="https://kcpl-automation-suite.vercel.app" target="_blank" rel="noopener">Reports</a>
  <a class="topbar-link" href="https://github.com/Hem2006/KCPL-Automation-Suite/actions" target="_blank" rel="noopener">Actions</a>
</div>

<div class="page">

  <!-- Login -->
  <div id="login-section" class="login-wrap">
    <div class="panel">
      <div class="panel-header">Sign in</div>
      <div class="panel-body">
        <label class="field-label" for="username">Username</label>
        <input type="text" id="username" placeholder="Enter username" autocomplete="username">
        <label class="field-label" for="password" style="margin-top:12px">Password</label>
        <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
        <div id="login-error" class="error-msg">Invalid credentials. Try again.</div>
        <button class="btn btn-primary btn-block" id="login-btn">Sign in</button>
      </div>
    </div>
  </div>

  <!-- Main content (hidden until logged in) -->
  <div id="main-content" class="hidden">
    <div class="page-title">Test Runner</div>
    <div class="page-desc">Select a test suite or expand to pick individual test cases, then trigger a run.</div>

    <div class="columns">
      <div class="col-main">
        <div class="panel">
          <div class="panel-header">Test suites</div>
          <div class="test-list-wrap" id="test-picker"></div>
          <div class="sel-bar">
            <span class="sel-label">Selected:</span>
            <span class="sel-value" id="selection-display">All tests (full suite)</span>
          </div>
        </div>
        <div class="trigger-footer">
          <button class="btn btn-primary" id="trigger-btn">Run selected tests</button>
        </div>
        <div id="trigger-error" class="error-msg"></div>
      </div>

      <div class="col-side">
        <div id="status-section" class="panel hidden">
          <div class="panel-header">Run status</div>
          <div class="panel-body">
            <div class="status-row">
              <span class="status-label">Test</span>
              <span class="status-value" id="st-spec">—</span>
            </div>
            <div class="status-row">
              <span class="status-label">Status</span>
              <span id="st-badge"><span class="badge badge-waiting">waiting</span></span>
            </div>
            <div class="status-row" id="st-run-row" style="display:none">
              <span class="status-label">Run</span>
              <span class="status-value" id="st-run">#—</span>
            </div>
            <div id="st-links" class="action-links" style="display:none">
              <a id="link-gh" class="btn btn-outline" href="#" target="_blank" rel="noopener">GitHub Actions</a>
              <a id="link-allure" class="btn btn-primary" href="https://kcpl-automation-suite.vercel.app" target="_blank" rel="noopener">Allure Report</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
(function () {
  const $ = (s) => document.querySelector(s);

  const SPECS = [
    { file: '01-login.spec.ts',                label: '01 - Login' },
    { file: '02-navigation.spec.ts',            label: '02 - Navigation' },
    { file: '03-creation.spec.ts',              label: '03 - Creation' },
    { file: '04-receipt.spec.ts',               label: '04 - Receipt' },
    { file: '05-auction.spec.ts',               label: '05 - Auction' },
    { file: '06-guarantor.spec.ts',             label: '06 - Guarantor details' },
    { file: '07-payment-voucher.spec.ts',       label: '07 - Payment voucher' },
    { file: '08-paid-voucher.spec.ts',          label: '08 - Paid voucher List' },
    { file: '09-collection.spec.ts',            label: '09 - Collection' },
    { file: '10-report.spec.ts',                label: '10 - Report' },
    { file: '11-accounts-creation.spec.ts',     label: '11 - Accounts Creation' },
    { file: '12-accounts-transaction.spec.ts',  label: '12 - Accounts Transaction' },
    { file: '13-accounts-report.spec.ts',       label: '13 - Accounts Report' },
    { file: '14-hr.spec.ts',                    label: '14 - HR' },
    { file: '15-audit.spec.ts',                 label: '15 - Audit' },
    { file: '16-legal.spec.ts',                 label: '16 - Legal' },
  ];

  const loginSection    = $('#login-section');
  const mainContent     = $('#main-content');
  const statusSection   = $('#status-section');
  const loginBtn        = $('#login-btn');
  const loginError      = $('#login-error');
  const usernameInput   = $('#username');
  const passwordInput   = $('#password');
  const triggerBtn      = $('#trigger-btn');
  const triggerError    = $('#trigger-error');
  const picker          = $('#test-picker');
  const selDisplay      = $('#selection-display');

  let pollTimer = null;
  let selection = { specFile: 'all', testGrep: '', label: 'All tests (full suite)' };
  const testCache = {};

  async function login() {
    loginBtn.disabled = true;
    loginError.style.display = 'none';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: usernameInput.value, password: passwordInput.value }),
      });
      if (res.ok) {
        showMain();
      } else {
        loginError.style.display = 'block';
      }
    } catch {
      loginError.textContent = 'Network error. Try again.';
      loginError.style.display = 'block';
    }
    loginBtn.disabled = false;
  }

  loginBtn.addEventListener('click', login);
  passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
  usernameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') passwordInput.focus(); });

  function showMain() {
    loginSection.classList.add('hidden');
    mainContent.classList.remove('hidden');
    buildPicker();
  }

  async function checkSession() {
    try {
      const res = await fetch('/api/status?triggeredAt=0');
      if (res.status !== 401) {
        showMain();
        resumeActiveRun();
      }
    } catch {}
  }
  checkSession();

  function resumeActiveRun() {
    const saved = localStorage.getItem('kcpl_active_run');
    if (!saved) return;
    try {
      const run = JSON.parse(saved);
      if (!run.triggeredAt) return;
      if (Date.now() - run.triggeredAt > 3600000) {
        localStorage.removeItem('kcpl_active_run');
        return;
      }
      $('#st-spec').textContent = run.label || '—';
      setBadge('waiting');
      $('#st-run-row').style.display = 'none';
      $('#st-links').style.display = 'none';
      statusSection.classList.remove('hidden');
      startPolling(run.triggeredAt);
    } catch {
      localStorage.removeItem('kcpl_active_run');
    }
  }

  function buildPicker() {
    picker.innerHTML = '';

    const allRow = document.createElement('div');
    allRow.className = 'all-row selected';
    allRow.innerHTML = '<span class="spec-name">All tests (full suite)</span>';
    allRow.addEventListener('click', () => {
      clearSelections();
      allRow.classList.add('selected');
      selection = { specFile: 'all', testGrep: '', label: 'All tests (full suite)' };
      selDisplay.textContent = selection.label;
    });
    picker.appendChild(allRow);

    SPECS.forEach((spec) => {
      const wrapper = document.createElement('div');

      const row = document.createElement('div');
      row.className = 'spec-row';
      row.innerHTML = `
        <span class="spec-arrow">&#9654;</span>
        <span class="spec-name">${spec.label}</span>
        <span class="spec-count"></span>
        <button class="spec-run-btn">Run all</button>
      `;

      const arrow = row.querySelector('.spec-arrow');
      const countEl = row.querySelector('.spec-count');
      const runBtn = row.querySelector('.spec-run-btn');

      const testList = document.createElement('div');
      testList.className = 'test-sub';

      row.addEventListener('click', (e) => {
        if (e.target === runBtn) return;
        const isOpen = testList.classList.contains('open');
        if (isOpen) {
          testList.classList.remove('open');
          arrow.classList.remove('open');
        } else {
          testList.classList.add('open');
          arrow.classList.add('open');
          loadTests(spec.file, testList, countEl);
        }
      });

      runBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        clearSelections();
        row.classList.add('selected');
        selection = { specFile: spec.file, testGrep: '', label: spec.label };
        selDisplay.textContent = selection.label;
      });

      wrapper.appendChild(row);
      wrapper.appendChild(testList);
      picker.appendChild(wrapper);
    });
  }

  function clearSelections() {
    picker.querySelectorAll('.selected').forEach(el => el.classList.remove('selected'));
  }

  async function loadTests(file, container, countEl) {
    if (testCache[file]) {
      renderTests(file, testCache[file], container, countEl);
      return;
    }
    container.innerHTML = '<div class="test-loading"><span class="spinner"></span>Loading...</div>';
    try {
      const res = await fetch(`/api/tests?file=${encodeURIComponent(file)}`);
      if (!res.ok) { container.innerHTML = '<div class="test-loading">Failed to load</div>'; return; }
      const data = await res.json();
      const tests = data[file] || [];
      testCache[file] = tests;
      renderTests(file, tests, container, countEl);
    } catch {
      container.innerHTML = '<div class="test-loading">Failed to load</div>';
    }
  }

  function renderTests(file, tests, container, countEl) {
    countEl.textContent = tests.length;
    container.innerHTML = '';
    if (tests.length === 0) { container.innerHTML = '<div class="test-loading">No tests</div>'; return; }

    tests.forEach((name) => {
      const item = document.createElement('div');
      item.className = 'test-item';
      item.innerHTML = `<span class="test-item-dot"></span><span class="test-item-name">${escapeHtml(name)}</span>`;
      item.addEventListener('click', () => {
        clearSelections();
        item.classList.add('selected');
        const specLabel = SPECS.find(s => s.file === file)?.label || file;
        selection = { specFile: file, testGrep: name, label: specLabel + ' > ' + name };
        selDisplay.textContent = selection.label;
      });
      container.appendChild(item);
    });
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  async function trigger() {
    triggerBtn.disabled = true;
    triggerError.style.display = 'none';
    try {
      const res = await fetch('/api/trigger', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ specFile: selection.specFile, testGrep: selection.testGrep }),
      });
      const data = await res.json();
      if (!res.ok) {
        triggerError.textContent = data.error || 'Trigger failed';
        triggerError.style.display = 'block';
        triggerBtn.disabled = false;
        return;
      }

      $('#st-spec').textContent = selection.label;
      setBadge('waiting');
      $('#st-run-row').style.display = 'none';
      $('#st-links').style.display = 'none';
      statusSection.classList.remove('hidden');

      localStorage.setItem('kcpl_active_run', JSON.stringify({
        triggeredAt: data.triggeredAt,
        label: selection.label,
      }));

      startPolling(data.triggeredAt);
    } catch {
      triggerError.textContent = 'Network error';
      triggerError.style.display = 'block';
    }
    triggerBtn.disabled = false;
  }

  triggerBtn.addEventListener('click', trigger);

  function setBadge(status) {
    const map = {
      waiting: 'badge-waiting',
      queued: 'badge-queued',
      in_progress: 'badge-running',
      completed: 'badge-completed',
      failure: 'badge-failed',
    };
    const cls = map[status] || 'badge-waiting';
    const text = status === 'in_progress' ? 'running' : status;
    const spinner = (status === 'waiting' || status === 'queued' || status === 'in_progress')
      ? '<span class="spinner"></span>' : '';
    $('#st-badge').innerHTML = `${spinner}<span class="badge ${cls}">${text}</span>`;
  }

  function startPolling(triggeredAt) {
    if (pollTimer) clearInterval(pollTimer);
    const poll = async () => {
      try {
        const res = await fetch(`/api/status?triggeredAt=${triggeredAt}`);
        if (res.status === 401) { location.reload(); return; }
        const data = await res.json();
        if (!data.found) { setBadge('waiting'); return; }

        setBadge(data.conclusion === 'failure' ? 'failure' :
                 data.conclusion === 'success' ? 'completed' : data.status);

        if (data.run_number) {
          $('#st-run-row').style.display = 'flex';
          $('#st-run').textContent = `#${data.run_number}`;
        }
        if (data.html_url) {
          $('#st-links').style.display = 'flex';
          $('#link-gh').href = data.html_url;
        }
        if (data.status === 'completed') {
          clearInterval(pollTimer);
          pollTimer = null;
          localStorage.removeItem('kcpl_active_run');
        }
      } catch {}
    };
    poll();
    pollTimer = setInterval(poll, 5000);
  }
})();
</script>
