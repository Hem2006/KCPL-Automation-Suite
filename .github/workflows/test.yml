name: KCPL Smoke Tests

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '0 23 * * *'  # 11 PM UTC daily
  workflow_dispatch:
    inputs:
      spec_file:
        description: 'Spec file to run (or "all" for full suite)'
        type: choice
        default: 'all'
        options:
          - all
          - 01-login.spec.ts
          - 02-navigation.spec.ts
          - 03-creation.spec.ts
          - 04-receipt.spec.ts
          - 05-auction.spec.ts
          - 06-guarantor.spec.ts
          - 07-payment-voucher.spec.ts
          - 08-paid-voucher.spec.ts
          - 09-collection.spec.ts
          - 10-report.spec.ts
          - 11-accounts-creation.spec.ts
          - 12-accounts-transaction.spec.ts
          - 13-accounts-report.spec.ts
          - 14-hr.spec.ts
          - 15-audit.spec.ts
          - 16-legal.spec.ts

permissions:
  contents: read

concurrency:
  group: smoke-tests
  cancel-in-progress: false

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install system deps (browser already cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Connectivity check
        run: curl -v --max-time 15 https://dev.mykcpl.com/admin/index.html || true

      - name: Run smoke tests
        if: always()
        env:
          CI: true
        run: |
          SPEC="${{ github.event.inputs.spec_file }}"
          if [ "$SPEC" = "all" ] || [ -z "$SPEC" ]; then
            npx playwright test --grep @smoke
          else
            npx playwright test "tests/smoke/$SPEC"
          fi

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_number }}
          path: allure-report/
          retention-days: 30

      - name: Deploy Allure report to Vercel
        if: always()
        id: vercel-deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          DEPLOY_URL=$(npx vercel deploy ./allure-report --prod --token="$VERCEL_TOKEN" --yes)
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $DEPLOY_URL"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: test-results/
          retention-days: 14

      - name: Send email summary
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RUN_NUMBER: ${{ github.run_number }}
          REPORT_URL: ${{ steps.vercel-deploy.outputs.url }}
        run: |
          node -e "(async () => {
          const fs = require('fs');
          const apiKey = process.env.RESEND_API_KEY;
          if (!apiKey) { console.log('[EMAIL] No RESEND_API_KEY, skipping'); process.exit(0); }

          let summary = { passed: 0, failed: 0, flaky: 0, skipped: 0 };
          try { summary = JSON.parse(fs.readFileSync('test-summary.json', 'utf8')); } catch {}
          const total = summary.passed + summary.failed + summary.flaky + summary.skipped;

          const runNum    = process.env.RUN_NUMBER;
          const reportUrl = process.env.REPORT_URL || 'https://kcpl-automation-suite.vercel.app';
          const now       = new Date();
          const date      = now.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
          const time      = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'UTC' });
          const label     = summary.failed > 0 ? summary.failed + ' FAILED' : 'ALL PASSED';

          const rows = [
            ['Total',   total],
            ['Passed',  summary.passed],
            ['Failed',  summary.failed],
            ['Flaky',   summary.flaky],
            ['Skipped', summary.skipped],
          ];
          const table = rows.map(([k, v]) => k.padEnd(10) + ': ' + v).join('\n');

          let body = 'KCPL Admin — Automated Test Report\n';
          body += date + '  |  ' + time + ' UTC  |  Run #' + runNum + '\n';
          body += '\n';
          body += table + '\n';
          body += '\n';
          body += 'Report: ' + reportUrl + '\n';

          const res = await fetch('https://api.resend.com/emails', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + apiKey, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              from: 'KCPL Tests <onboarding@resend.dev>',
              to: ['hemindukuru@gmail.com'],
              subject: 'KCPL Test Run — ' + label + ' — ' + date,
              text: body,
            }),
          });
          const json = await res.json();
          if (res.ok) console.log('[EMAIL] Sent to hemindukuru@gmail.com', json.id);
          else console.error('[EMAIL] Failed:', res.status, json);
          })();"
