name: KCPL Smoke Tests

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '0 23 * * *'  # 11 PM UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-tests
  cancel-in-progress: false

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install system deps (browser already cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Connectivity check
        run: curl -v --max-time 15 https://dev.mykcpl.com/admin/index.html || true

      - name: Run smoke tests
        if: always()
        env:
          CI: true
        run: npx playwright test --grep @smoke

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_number }}
          path: allure-report/
          retention-days: 30

      - name: Deploy Allure report to Vercel
        if: always()
        id: vercel-deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          DEPLOY_URL=$(npx vercel deploy ./allure-report --prod --token="$VERCEL_TOKEN" --yes)
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $DEPLOY_URL"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: test-results/
          retention-days: 14

      - name: Send email summary
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RUN_NUMBER: ${{ github.run_number }}
          REPORT_URL: ${{ steps.vercel-deploy.outputs.url }}
        run: |
          node -e "
          const apiKey = process.env.RESEND_API_KEY;
          if (!apiKey) process.exit(0);

          const runNum    = process.env.RUN_NUMBER;
          const reportUrl = process.env.REPORT_URL || 'https://kcpl-automation-suite.vercel.app';
          const now       = new Date();
          const date      = now.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
          const time      = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'UTC' });
          const divider   = '━'.repeat(60);

          let body = divider + '\n';
          body += '  KCPL Admin — Automated Test Report\n';
          body += '  ' + date + '  |  ' + time + ' UTC  |  Run #' + runNum + '\n';
          body += divider + '\n\n';
          body += '  Report  : ' + reportUrl + '\n';
          body += '\n' + divider + '\n';
          body += '  Sent by KCPL Test Pipeline  |  github.com/Hem2006/KCPL-Automation-Suite\n';
          body += divider + '\n';

          fetch('https://api.resend.com/emails', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + apiKey, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              from: 'KCPL Tests <onboarding@resend.dev>',
              to: ['hemindukuru@gmail.com'],
              subject: 'KCPL Test Run — ' + date,
              text: body,
            }),
          })
          .then(() => console.log('[EMAIL] Report sent to hemindukuru@gmail.com'))
          .catch(err => console.error('[EMAIL] Failed:', err));
          "
