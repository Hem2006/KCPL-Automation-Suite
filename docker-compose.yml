version: "3.8"

services:
  healenium-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: healenium
      POSTGRES_USER: healenium
      POSTGRES_PASSWORD: YDk2nmNs4s9aCP6K
    ports:
      - "5432:5432"
    volumes:
      - healenium-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healenium"]
      interval: 5s
      timeout: 3s
      retries: 5

  healenium:
    image: healenium/hlm-backend:3.5.0
    depends_on:
      healenium-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://healenium-db:5432/healenium
      SPRING_DATASOURCE_USERNAME: healenium
      SPRING_DATASOURCE_PASSWORD: YDk2nmNs4s9aCP6K
      HLM_LOG_LEVEL: info
    ports:
      - "7878:7878"

volumes:
  healenium-pgdata:
